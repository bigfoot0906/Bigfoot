<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b4a2f">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>Bigfoot</title>
<style>
:root{--bg:#f4f1ea;--c:#fff;--t:#222;--m:#6b6b6b;--a:#3b4a2f;--r:#b3261e;--o:#c77700;--l:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#161812;--c:#23261e;--t:#eee;--m:#a0a090;--a:#8fae6b;--r:#ff8a80;--o:#ffb74d;--l:#3a3d33}}
*{box-sizing:border-box}body{margin:0;font:17px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
main{max-width:600px;margin:auto;padding:12px}
.card{background:var(--c);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}
input,select,button{font:inherit;width:100%;padding:12px;margin:4px 0;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t)}
.big{font-size:30px;text-align:center;padding:16px}
button{background:var(--a);color:var(--bg);border:0;font-weight:600}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
label{font-size:14px;color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--m);border:0;border-radius:0;margin:0;padding:12px 4px;font-size:13px}nav .on{color:var(--a);border-top:3px solid var(--a)}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--l);font-size:15px}
small{color:var(--m);display:block}.it .x{width:auto;background:none;color:var(--m);padding:4px 10px;margin:0}
.late{color:var(--r)}.soon{color:var(--o)}.al{border-left:5px solid var(--r)}
img.ph{width:48px;height:48px;object-fit:cover;border-radius:8px}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
let db;try{db=JSON.parse(localStorage.getItem('jeep'))}catch(e){}
db=db||{km:217414,items:[],bk:0};
const save=()=>{try{localStorage.setItem('jeep',JSON.stringify(db))}catch(e){alert("Mémoire pleine : faites une sauvegarde (Réglages) puis supprimez d'anciennes photos.")}};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR',{timeZone:'UTC'}):'';
const n=v=>parseFloat(String(v).replace(',','.'));
const fx=(v,d=1)=>v.toFixed(d).replace('.',',');
const eur=v=>fx(v,2)+' €';
const days=d=>Math.round((new Date(d)-new Date(today()))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='plein',tmpPhoto='';

function pick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);tmpPhoto=c.toDataURL('image/jpeg',.6);$('#pv').textContent='✔ Photo prête'};i.src=r.result};r.readAsDataURL(f)}
const photoField=()=>`<label>Photo (facture, ticket…)</label><input type=file accept="image/*" onchange="pick(this)"><small id=pv></small>`;

function alerts(){const a=[];db.items.forEach(i=>{
 if(i.t=='m'){if(i.nd){const d=days(i.nd);if(d<=30)a.push([d<0,`${esc(i.name)} : ${d<0?'dépassé depuis '+(-d)+' j':'dans '+d+' j'}`])}
  if(i.nk){const r=i.nk-db.km;if(r<=1000)a.push([r<0,`${esc(i.name)} : ${r<0?'dépassé de '+(-r):'dans '+r} km`])}}
 if(i.t=='d'&&i.exp){const d=days(i.exp);if(d<=30)a.push([d<0,`${esc(i.name)} : ${d<0?'expiré depuis '+(-d)+' j':'expire dans '+d+' j'}`])}});
 if(db.items.length&&(!db.bk||(Date.now()-db.bk)/864e5>30))a.push([0,'Pensez à faire une sauvegarde (Réglages)']);
 return a}

function list(type,fmt){const l=db.items.filter(i=>i.t==type).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 return l.map(i=>`<div class="it"><div style="display:flex;gap:8px">${i.ph?`<img class=ph src="${i.ph}" onclick="show(${i.id})">`:''}<div>${fmt(i)}</div></div><button class=x onclick="del(${i.id})">✕</button></div>`).join('')||'<small>Rien pour l\'instant</small>'}

function fuelStats(){const f=db.items.filter(i=>i.t=='f').sort((a,b)=>a.id-b.id);let p=null;
 f.forEach(i=>{i.c=null;if(i.km){if(p&&i.km>p.km)i.c=i.l/(i.km-p.km)*100;p=i}});return f}

function vPlein(){const f=fuelStats(),cs=f.filter(i=>i.c).map(i=>i.c),avg=cs.length?cs.reduce((a,b)=>a+b)/cs.length:0,last=f.filter(i=>i.c).pop();
 return `<div class=card><div class=row><div><label>Litres</label><input id=l class=big inputmode=decimal placeholder="0"></div><div><label>Prix payé (€)</label><input id=p class=big inputmode=decimal placeholder="0"></div></div>
 <label>Kilométrage (facultatif, sert à calculer la consommation)</label><input id=k inputmode=numeric placeholder="dernier connu : ${db.km}">
 <button onclick=addF()>Enregistrer le plein</button></div>
 <div class=card><b>Consommation moyenne :</b> ${avg?fx(avg)+' L/100 km':'—'}<small>${last?'Dernier plein : '+fx(last.c)+' L/100 km':'Entrez le km sur 2 pleins pour la calculer'}</small></div>
 <div class=card><b>Derniers pleins</b>${list('f',i=>`${fd(i.date)} · ${fx(i.l,2)} L · ${eur(i.p)}<small>${fx(i.p/i.l,3)} €/L${i.km?' · '+i.km+' km':''}${i.c?' · '+fx(i.c)+' L/100':''}</small>`)}</div>`}
function addF(){const l=n($('#l').value),p=n($('#p').value),k=parseInt($('#k').value);
 if(!(l>0&&p>0))return alert('Entrez les litres et le prix.');
 const i={id:Date.now(),t:'f',date:today(),l,p};if(k>0){i.km=k;if(k>db.km)setKm(k)}
 put(i);navigator.vibrate&&navigator.vibrate(60)}

function vEnt(){return `<div class=card><b>Ajouter un entretien</b>
<input id=nm list=sg placeholder="Quoi ? (Vidange, Pneus…)"><datalist id=sg><option>Vidange<option>Filtres<option>Pneus<option>Freins<option>Courroie<option>Batterie<option>Contrôle technique<option>Réparation</datalist>
<div class=row><div><label>Date</label><input id=dt type=date value="${today()}"></div><div><label>Km</label><input id=k inputmode=numeric value="${db.km}"></div></div>
<label>Prochaine échéance (facultatif)</label><div class=row><input id=nd type=date><input id=nk inputmode=numeric placeholder="à tel km"></div>
<label>Coût (€)</label><input id=p inputmode=decimal>${photoField()}<button onclick=addM()>Enregistrer</button></div>
<div class=card><b>Historique</b>${list('m',i=>`${esc(i.name)}<small>${fd(i.date)}${i.km?' · '+i.km+' km':''}${i.p?' · '+eur(i.p):''}${i.nd?' · prochain le '+fd(i.nd):''}${i.nk?' · prochain à '+i.nk+' km':''}</small>`)}</div>`}
function addM(){const name=$('#nm').value.trim();if(!name)return alert('Indiquez ce qui a été fait.');const k=parseInt($('#k').value)||0;if(k>db.km)setKm(k);
 put({id:Date.now(),t:'m',name,date:$('#dt').value||today(),km:k,nd:$('#nd').value,nk:parseInt($('#nk').value)||0,p:n($('#p').value)||0,ph:tmpPhoto});tmpPhoto=''}

function vDoc(){return `<div class=card><b>Ajouter un papier, un équipement ou une facture</b>
<select id=cat><option value="Papier">Papier (assurance, carte grise…)</option><option value="Équipement">Équipement acheté</option><option value="Facture">Facture / ticket</option></select>
<input id=nm placeholder="Nom (ex : Assurance, treuil…)"><div class=row><div><label>Date</label><input id=dt type=date value="${today()}"></div><div><label>Expire le</label><input id=ex type=date></div></div>
<label>Prix (€)</label><input id=p inputmode=decimal>${photoField()}<button onclick=addD()>Enregistrer</button></div>
<div class=card><b>Mes documents</b>${list('d',i=>`${esc(i.name)}<small>${esc(i.cat)} · ${fd(i.date)}${i.p?' · '+eur(i.p):''}${i.exp?' · expire le '+fd(i.exp):''}</small>`)}</div>`}
function addD(){const name=$('#nm').value.trim();if(!name)return alert('Indiquez un nom.');
 put({id:Date.now(),t:'d',cat:$('#cat').value,name,date:$('#dt').value||today(),exp:$('#ex').value,p:n($('#p').value)||0,ph:tmpPhoto});tmpPhoto=''}

function vSet(){return syncCard()+`<div class=card><b>Kilométrage actuel</b><input id=k inputmode=numeric value="${db.km}"><button onclick="setKm(parseInt($('#k').value)||db.km);render()">Mettre à jour</button></div>
<div class=card><b>Sauvegarde</b><small>Dernière : ${db.bk?fd(new Date(db.bk).toISOString().slice(0,10)):'jamais'}</small>
<button onclick=exp()>Sauvegarder mes données</button><label>Restaurer depuis un fichier de sauvegarde</label><input type=file accept=".json" onchange=imp(this)></div>`}
function exp(){db.bk=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='jeep-sauvegarde-'+today()+'.json';a.click();render()}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;
 if(confirm('Ajouter les données de cette sauvegarde ?')){db=d;save();if(col){d.items.forEach(i=>col.doc(String(i.id)).set(i));setKm(d.km||db.km)}render()}}catch(e){alert('Fichier non valide.')}};r.readAsText(f)}

function del(id){if(confirm('Supprimer cet élément ?')){rm(id)}}
function show(id){const i=db.items.find(x=>x.id==id),o=document.createElement('div');o.style='position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9';o.innerHTML=`<img src="${i.ph}" style="max-width:100%;max-height:100%">`;o.onclick=()=>o.remove();document.body.append(o)}

const T=[['plein','⛽','Plein'],['ent','🔧','Entretien'],['doc','📄','Papiers'],['set','⚙️','Réglages']];
function render(){const V={plein:vPlein,ent:vEnt,doc:vDoc,set:vSet},a=alerts();
 $('#app').innerHTML=syncBar()+(a.length?`<div class="card al">${a.map(x=>`<div class="${x[0]?'late':'soon'}">⚠ ${x[1]}</div>`).join('')}</div>`:'')+V[tab]();
 $('#nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';tmpPhoto='';render()">${t[1]}<br>${t[2]}</button>`).join('')}
const cfg={apiKey:"AIzaSyBFM-UBOw1St6uczsDYX2IKbhRTU_AHhCc",authDomain:"bigfoot-jeep-jku.firebaseapp.com",projectId:"bigfoot-jeep-jku",storageBucket:"bigfoot-jeep-jku.firebasestorage.app",messagingSenderId:"398828328349",appId:"1:398828328349:web:b6d17f012a2f0c1278cb74"};
let fs,col,user,st='',defer=0,unsub;
const setKm=k=>{db.km=k;save();col&&fs.collection('meta').doc('cfg').set({km:k}).catch(()=>{})};
function put(x){db.items=db.items.filter(i=>i.id!=x.id);db.items.push(x);save();col&&col.doc(String(x.id)).set(x).catch(()=>{});render()}
function rm(id){db.items=db.items.filter(i=>i.id!=id);save();col&&col.doc(String(id)).delete().catch(()=>{});render()}
function draw(){const e=document.activeElement;if(e&&e.matches('input,select'))defer=1;else render()}
document.addEventListener('focusout',()=>{if(defer)setTimeout(()=>{const e=document.activeElement;if(!(e&&e.matches('input,select'))){defer=0;render()}},300)});
addEventListener('online',render);addEventListener('offline',render);
const syncBar=()=>user?`<small style="text-align:center">☁ ${navigator.onLine?(st||'…'):'Hors ligne'}</small>`:`<div class="card al"><b>Non synchronisé.</b> Connectez-vous dans Réglages.</div>`;
function syncCard(){return user?`<div class=card><b>Synchronisation</b><small>Connecté : ${esc(user.email)}</small><button onclick="firebase.auth().signOut()">Se déconnecter</button></div>`:`<div class=card><b>Connexion (synchronisation)</b><input id=em type=email placeholder="Adresse e-mail" autocomplete=username><input id=pw type=password placeholder="Mot de passe" autocomplete=current-password><button onclick=login()>Se connecter</button></div>`}
function login(){firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).then(()=>{tab='plein';render()}).catch(e=>alert(e.code=='auth/network-request-failed'?'Pas de réseau : la première connexion en demande.':'Adresse ou mot de passe incorrect.'))}
try{firebase.initializeApp(cfg);fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
firebase.auth().onAuthStateChanged(u=>{user=u;unsub&&unsub();unsub=0;col=null;
 if(u){col=fs.collection('items');
  if(!localStorage.getItem('jeepMig')){db.items.forEach(i=>col.doc(String(i.id)).set(i).catch(()=>{}));if(db.km!=217414)fs.collection('meta').doc('cfg').set({km:db.km}).catch(()=>{});localStorage.setItem('jeepMig','1')}
  unsub=col.onSnapshot(q=>{db.items=q.docs.map(d=>d.data());save();st=q.metadata.hasPendingWrites?"Envoi en attente":"Synchronisé";draw()},()=>{});
  fs.collection('meta').doc('cfg').onSnapshot(d=>{if(d.exists&&d.data().km){db.km=d.data().km;save();draw()}},()=>{})}
 render()})}catch(e){}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
