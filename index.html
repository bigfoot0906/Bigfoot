<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f3a24">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>Bigfoot</title>
<style>
:root{--bg:#ece6d6;--c:#fbf8f0;--t:#232618;--m:#6c6a58;--a:#3b4a2f;--ab:#f4f1ea;--hi:#d97a14;--o2:#6f8fa6;--r:#b3261e;--o:#b06400;--l:#d8d0bb;--hd:#2f3a24;--sh:0 2px 0 #0001,0 6px 14px #3b2f1a14}
@media(prefers-color-scheme:dark){:root{--bg:#14160f;--c:#1f2318;--t:#efeadb;--m:#a3a08c;--a:#8fae6b;--ab:#14160f;--hi:#f0932b;--r:#ff8a80;--o:#ffb74d;--l:#343829;--hd:#1d2416;--sh:0 2px 0 #0004}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:96px}
header{background:var(--hd);color:#f4f1ea;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 26px;position:relative;overflow:hidden;border-radius:0 0 28px 28px;box-shadow:0 6px 18px #0003}
header::before{content:"";position:absolute;inset:0;opacity:.13;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='160' fill='none' stroke='%23c9d8a8' stroke-width='1.2'><path d='M-10 40c50-30 90 30 150 0s90-30 190 10'/><path d='M-10 70c50-30 90 30 150 0s90-30 190 10'/><path d='M-10 100c50-30 90 30 150 0s90-30 190 10'/><path d='M-10 130c50-30 90 30 150 0s90-30 190 10'/></svg>") center/320px}
header img{position:relative;display:block;width:min(88vw,380px);height:auto;margin:0 auto;filter:drop-shadow(0 6px 10px #0008)}
.odo{position:relative;display:inline-flex;align-items:baseline;gap:6px;margin-top:10px;padding:6px 16px;background:#0006;border:1px solid #ffffff22;border-radius:999px;font:700 22px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em;color:#ffd9a0}
.odo small{display:inline;color:#c9d2b8;font:600 13px system-ui,sans-serif;letter-spacing:0}
main{max-width:600px;margin:auto;padding:6px 12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card>b:first-child{display:block;font-size:18px;margin-bottom:6px}
input,select,button,textarea{font:inherit;width:100%;padding:13px 14px;margin:4px 0;border-radius:12px;border:1.5px solid var(--l);background:var(--bg);color:var(--t)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--hi);outline-offset:1px;border-color:var(--hi)}
.big{font-size:32px;font-weight:700;text-align:center;padding:16px 8px}
button{background:var(--hi);color:#1d1606;border:0;font-weight:800;font-size:17px;padding:15px;box-shadow:0 3px 0 #0003;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:none}
button.g{background:var(--bg);color:var(--t);border:1.5px solid var(--l);box-shadow:none;font-weight:700}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
label{font-size:14px;font-weight:600;color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:2px;background:var(--hd);padding:8px 6px max(8px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -4px 16px #0004;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:#b9c3a6;border:0;border-radius:14px;margin:0;padding:8px 0;font-size:11.5px;font-weight:600;box-shadow:none;min-width:0}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav .on{background:#ffffff1c;color:#ffb257}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--l);font-size:15.5px}
.it:last-child{border-bottom:0}
.im{display:flex;gap:10px;min-width:0;align-items:center}
.ac{display:flex;flex:none;align-items:center}
small{color:var(--m);display:block}
.it .x{width:auto;min-width:42px;min-height:42px;background:none;color:var(--m);padding:4px 8px;margin:0;box-shadow:none;font-weight:400;font-size:18px}
.late{color:var(--r);font-weight:600}.soon{color:var(--o);font-weight:600}.al{border-left:6px solid var(--r)}
img.ph{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none}
.seg{display:flex;gap:8px;margin:12px 0}.seg button{background:var(--c);color:var(--t);border:1.5px solid var(--l);box-shadow:none;font-size:15px;padding:12px 8px;margin:0}
.seg .on{background:var(--a);color:var(--ab);border-color:var(--a)}
label.ck{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:6px 0;font-size:16px;font-weight:400;color:var(--t)}
.ck input{width:28px;height:28px;margin:0;flex:none;accent-color:var(--hi)}
.ck.done span{text-decoration:line-through;color:var(--m)}
.gh{margin-top:12px;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--hi);text-transform:uppercase}
.pg{height:10px;border-radius:6px;background:var(--l);overflow:hidden;margin:6px 0 4px}.pg i{display:block;height:100%;background:var(--hi)}
.chart{display:flex;gap:4px;align-items:flex-end;height:140px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--m);min-width:0}
.stk{display:flex;flex-direction:column-reverse;width:100%;max-width:26px;border-radius:5px 5px 0 0;overflow:hidden}.stk i{display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.st{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:12px;box-shadow:var(--sh)}.st b{display:block;font-size:21px}.st span{font-size:13px;color:var(--m)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--m);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.ln{width:100%;height:auto}.ln polyline{fill:none;stroke:var(--hi);stroke-width:2.5;stroke-linejoin:round}.ln circle{fill:var(--hi)}.ln line{stroke:var(--m);stroke-dasharray:4 4;opacity:.6}.ln text{fill:var(--m);font-size:11px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--hi);color:#1d1606;font-weight:700;padding:10px 12px 10px 16px;border-radius:16px;box-shadow:0 6px 18px #0006}
#upd button{width:auto;margin:0;padding:10px 14px;background:#1d1606;color:#ffd9a0;box-shadow:none}
#carnet{position:fixed;inset:0;z-index:20;background:#fff;color:#000;overflow:auto;padding:16px;font-size:14px}
#carnet .bar{display:flex;gap:8px;margin-bottom:12px}#carnet .bar button{margin:0}
#carnet h1{margin:0;font-size:24px}#carnet h2{margin:2px 0 8px;font-size:18px;font-weight:600;color:#3b4a2f}
#carnet table{width:100%;border-collapse:collapse}#carnet th{background:#3b4a2f;color:#fff;text-align:left;padding:6px}#carnet td{padding:6px;border-bottom:1px solid #ccc;vertical-align:middle}#carnet tr.t td{font-weight:700;border-top:2px solid #3b4a2f}#carnet img{height:56px;border-radius:4px}
@media print{body>*:not(#carnet){display:none!important}body{background:#fff;padding:0}#carnet{position:static!important;padding:0;overflow:visible}#carnet .bar{display:none}#carnet tr{break-inside:avoid}}
</style>
</head><body><header><img src="logo.png" alt="Jeep"><div class="odo"><span id="km">0</span><small>km</small></div></header><main id="app"></main><nav id="nav"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
/* ---------- Stockage local (IndexedDB : bien plus grand que localStorage) ---------- */
const IDB={o(){return this.p||(this.p=new Promise((ok,ko)=>{const r=indexedDB.open('bigfoot',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}))},
 async get(k){const d=await this.o();return new Promise((ok,ko)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})},
 async set(k,v){const d=await this.o();return new Promise((ok,ko)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>ko(t.error)})}};
let db={km:217414,items:[],bk:0};
const save=()=>{IDB.set('db',db).then(()=>{try{localStorage.removeItem('jeep')}catch(e){}}).catch(()=>{try{localStorage.setItem('jeep',JSON.stringify(db))}catch(e){alert("Mémoire pleine : faites une sauvegarde (Réglages) puis supprimez d'anciennes photos.")}})};
async function load(){let v=null;try{v=await IDB.get('db')}catch(e){}
 if(v&&Array.isArray(v.items))db=v;
 else{try{v=JSON.parse(localStorage.getItem('jeep'))}catch(e){v=null}if(v&&Array.isArray(v.items)){db=v;save()}}
 db.items=db.items||[];db.km=db.km||217414}
/* ---------- Outils ---------- */
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR',{timeZone:'UTC'}):'';
const n=v=>parseFloat(String(v).replace(',','.'));
const fx=(v,d=1)=>v.toFixed(d).replace('.',',');
const eur=v=>fx(v,2)+' €';
const nf=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');
const days=d=>Math.round((new Date(d)-new Date(today()))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const sortie=id=>db.items.find(x=>x.t=='s'&&x.id==id);
function sCost(s){const p=db.items.filter(i=>i.t=='f'&&i.so==s.id),fc=p.reduce((a,i)=>a+i.p,0),l=p.reduce((a,i)=>a+i.l,0),af=s.af||0;return{n:p.length,fc,l,af,tot:fc+af}}
const cmpD=(a,b)=>(a.date||'').localeCompare(b.date||'')||a.id-b.id;
let tab='plein',sub='carnet',tmpPhoto='',ed=null,F={q:'',per:'all',cat:''},B='12m',LC=null;
const val=id=>{const e=$('#'+id);return e?e.value:''};

function pick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);tmpPhoto=c.toDataURL('image/jpeg',.6);$('#pv').textContent='✔ Photo prête'};i.src=r.result};r.readAsDataURL(f)}
const photoField=()=>`<label>Photo (facture, ticket…)</label><input type=file accept="image/*" onchange="pick(this)"><small id=pv>${ed&&ed.ph?'Photo déjà enregistrée : elle est gardée si vous n\'en choisissez pas une autre.':''}</small>`;
const formBtns=(fn)=>`<button onclick=${fn}()>${ed?'Enregistrer les modifications':'Enregistrer'}</button>${ed?'<button class=g onclick="ed=null;tmpPhoto=\'\';render()">Annuler</button>':''}`;
const E=t=>ed&&ed.t==t?ed:{};

/* ---------- Alertes (seule l'entrée la plus récente de chaque nom compte) ---------- */
function latest(type){const m={};db.items.filter(i=>i.t==type).forEach(i=>{const k=norm(i.name),o=m[k];if(!o||cmpD(i,o)>0)m[k]=i});return Object.values(m)}
function alerts(){const a=[];
 latest('m').forEach(i=>{
  if(i.nd){const d=days(i.nd);if(d<=30)a.push([d<0,`${esc(i.name)} : ${d<0?'dépassé depuis '+(-d)+' j':'dans '+d+' j'}`])}
  if(i.nk){const r=i.nk-db.km;if(r<=1000)a.push([r<0,`${esc(i.name)} : ${r<0?'dépassé de '+nf(-r):'dans '+nf(r)} km`])}});
 latest('d').forEach(i=>{if(i.exp){const d=days(i.exp);if(d<=30)a.push([d<0,`${esc(i.name)} : ${d<0?'expiré depuis '+(-d)+' j':'expire dans '+d+' j'}`])}});
 if(db.items.length&&(!db.bk||(Date.now()-db.bk)/864e5>30))a.push([0,'Pensez à faire une sauvegarde (Réglages)']);
 return a}

/* ---------- Listes : recherche + filtres ---------- */
function inPer(d,per){if(per=='all'||!d)return true;const x=days(d);return per=='30'?x>=-30:per=='180'?x>=-182:per=='365'?x>=-365:d.slice(0,4)==per}
const hay=i=>norm([i.name,i.cat,i.notes,i.url,i.date,fd(i.date),i.km,i.dist,i.p,i.l,i.so&&(sortie(i.so)||{}).name].join(' '));
function filt(type){const q=norm(F.q).trim().split(/\s+/).filter(Boolean);
 return db.items.filter(i=>i.t==type&&(!F.cat||i.cat==F.cat)&&inPer(i.date,F.per)&&q.every(w=>hay(i).includes(w))).sort((a,b)=>cmpD(b,a))}
function row(i,fmt){return `<div class=it><div class=im>${i.ph?`<img class=ph src="${i.ph}" onclick="show(${i.id})">`:''}<div>${fmt(i)}</div></div><div class=ac><button class=x onclick="edit(${i.id})" aria-label="Modifier">✎</button><button class=x onclick="del(${i.id})" aria-label="Supprimer">✕</button></div></div>`}
function listCard(title,type,fmt,cats){LC={type,fmt};
 const yrs=[...new Set(db.items.filter(i=>i.t==type&&i.date).map(i=>i.date.slice(0,4)))].sort().reverse();
 const per=[['all','Toute période'],['30','30 derniers jours'],['180','6 derniers mois'],['365','12 derniers mois'],...yrs.map(y=>[y,'Année '+y])];
 return `<div class=card><b>${title}</b><input id=q type=search placeholder="🔍 Rechercher…" value="${esc(F.q)}" oninput="F.q=this.value;refList()"><div class=row><select onchange="F.per=this.value;refList()">${per.map(o=>`<option value="${o[0]}"${F.per==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>${cats?`<select onchange="F.cat=this.value;refList()"><option value="">Toutes catégories</option>${cats.map(c=>`<option${F.cat==c?' selected':''}>${c}</option>`).join('')}</select>`:''}</div><small id=lsum></small><div id=lst></div></div>`}
function refList(){if(!LC||!$('#lst'))return;const r=filt(LC.type);let s=r.length?r.length+' résultat'+(r.length>1?'s':''):'Aucun résultat';
 if(LC.type=='s'){const k=r.reduce((a,i)=>a+(i.dist||0),0),nu=r.reduce((a,i)=>a+(i.nuits||0),0);if(r.length)s+=' · '+nf(k)+' km · '+nu+' nuit'+(nu>1?'s':'')+' · '+eur(r.reduce((a,i)=>a+sCost(i).tot,0))}
 else{const p=r.reduce((a,i)=>a+(i.p||0),0);if(p)s+=' · '+eur(p)}
 $('#lsum').textContent=s;$('#lst').innerHTML=r.map(i=>row(i,LC.fmt)).join('')||"<small>Rien pour l'instant</small>"}

/* ---------- Pleins ---------- */
function fuel(){const f=db.items.filter(i=>i.t=='f').sort(cmpD),c={};let anc=null,acc=0;
 f.forEach(i=>{acc+=i.l;if(i.full===false)return;if(i.km){if(anc&&i.km>anc)c[i.id]=acc/(i.km-anc)*100;anc=i.km}else anc=null;acc=0});
 return{f,c}}
function vPlein(){const {f,c}=fuel(),cs=Object.values(c),avg=cs.length?cs.reduce((a,b)=>a+b)/cs.length:0,lastI=[...f].reverse().find(i=>c[i.id]),e=E('f');
 return `<div class=card id=frm><b>${e.id?'Modifier le plein':'Nouveau plein'}</b><div class=row><div><label>Litres</label><input id=l class=big inputmode=decimal placeholder="0" value="${e.l!=null?String(e.l).replace('.',','):''}"></div><div><label>Prix payé (€)</label><input id=p class=big inputmode=decimal placeholder="0" value="${e.p!=null?String(e.p).replace('.',','):''}"></div></div>
 <label>Kilométrage (facultatif, sert à calculer la consommation)</label><input id=k inputmode=numeric placeholder="dernier connu : ${db.km}" value="${e.km||''}">
 <label>Sortie 4x4 (facultatif)</label><select id=so><option value="">— Aucune —</option>${db.items.filter(i=>i.t=='s').sort((a,b)=>cmpD(b,a)).map(s=>`<option value="${s.id}"${e.so==s.id?' selected':''}>${esc(s.name)} · ${fd(s.date)}</option>`).join('')}</select>
 <label class=ck><input type=checkbox id=fl ${e.full===false?'':'checked'}><span>Plein complet (à ras bord)</span></label><small>Décochez pour un plein partiel : la consommation reste juste.</small>
 <label>Date</label><input id=dt type=date value="${e.date||today()}">${formBtns('addF')}</div>
 <div class=card><b>Consommation moyenne :</b> ${avg?fx(avg)+' L/100 km':'—'}<small>${lastI?'Dernier calcul : '+fx(c[lastI.id])+' L/100 km':'Il faut 2 pleins complets avec le kilométrage'}</small></div>`
 +listCard('Historique des pleins','f',i=>`${fd(i.date)} · ${fx(i.l,2)} L · ${eur(i.p)}${i.full===false?' · partiel':''}<small>${fx(i.p/i.l,3)} €/L${i.km?' · '+nf(i.km)+' km':''}${c[i.id]?' · '+fx(c[i.id])+' L/100':''}${i.so&&sortie(i.so)?' · 🏕 '+esc(sortie(i.so).name):''}</small>`)}
function addF(){const l=n(val('l')),p=n(val('p')),k=parseInt(val('k'));
 if(!(l>0&&p>0))return alert('Entrez les litres et le prix.');
 const i={id:ed?ed.id:Date.now(),t:'f',date:val('dt')||today(),l,p,full:$('#fl').checked};const so=parseInt(val('so'));if(so)i.so=so;if(k>0){i.km=k;if(k>db.km)setKm(k)}
 ed=null;put(i);navigator.vibrate&&navigator.vibrate(60)}

/* ---------- Entretien ---------- */
const IV={vidange:[10000,12],filtres:[10000,12],pneus:[40000,0],freins:[30000,0],courroie:[100000,60],batterie:[0,60],'controle technique':[0,24]};
function sug(){if(ed||val('nd')||val('nk'))return;const v=IV[norm(val('nm')).trim()];if(!v)return;
 const k=parseInt(val('k'))||db.km;if(v[0])$('#nk').value=k+v[0];
 if(v[1]){const d=new Date((val('dt')||today())+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+v[1]);$('#nd').value=d.toISOString().slice(0,10)}
 $('#sgh').textContent='Échéance proposée : modifiez-la si besoin.'}
function vEnt(){const e=E('m');return `<div class=card id=frm><b>${e.id?"Modifier l'entretien":'Ajouter un entretien'}</b>
<input id=nm list=sg placeholder="Quoi ? (Vidange, Pneus…)" value="${esc(e.name)}" onchange=sug()><datalist id=sg><option>Vidange<option>Filtres<option>Pneus<option>Freins<option>Courroie<option>Batterie<option>Contrôle technique<option>Réparation</datalist>
<div class=row><div><label>Date</label><input id=dt type=date value="${e.date||today()}"></div><div><label>Km</label><input id=k inputmode=numeric value="${e.km||db.km}"></div></div>
<label>Prochaine échéance (facultatif)</label><div class=row><input id=nd type=date value="${e.nd||''}"><input id=nk inputmode=numeric placeholder="à tel km" value="${e.nk||''}"></div><small id=sgh></small>
<label>Coût (€)</label><input id=p inputmode=decimal value="${e.p?String(e.p).replace('.',','):''}">${photoField()}${formBtns('addM')}</div>`
 +listCard('Historique','m',i=>`${esc(i.name)}<small>${fd(i.date)}${i.km?' · '+nf(i.km)+' km':''}${i.p?' · '+eur(i.p):''}${i.nd?' · prochain le '+fd(i.nd):''}${i.nk?' · prochain à '+nf(i.nk)+' km':''}</small>`)}
function addM(){const name=val('nm').trim();if(!name)return alert('Indiquez ce qui a été fait.');const k=parseInt(val('k'))||0;if(k>db.km)setKm(k);
 const i={id:ed?ed.id:Date.now(),t:'m',name,date:val('dt')||today(),km:k,nd:val('nd'),nk:parseInt(val('nk'))||0,p:n(val('p'))||0,ph:tmpPhoto||(ed&&ed.ph)||''};tmpPhoto='';ed=null;put(i)}

/* ---------- Papiers ---------- */
const DC=['Papier','Équipement','Facture'];
function vDoc(){const e=E('d');return `<div class=card id=frm><b>${e.id?'Modifier le document':'Ajouter un papier, un équipement ou une facture'}</b>

/* ---------- Mises à jour de l'appli ---------- */
let appV='',upMsg='',reg;
function showUp(){if($('#upd'))return;const d=document.createElement('div');d.id='upd';d.innerHTML='Nouvelle version prête <button onclick="location.reload()">Mettre à jour</button>';document.body.append(d)}
function askV(){const c=navigator.serviceWorker.controller;if(!c)return;const ch=new MessageChannel();ch.port1.onmessage=e=>{appV=e.data;const v=$('#ver');if(v)v.textContent='Version '+appV};c.postMessage('v',[ch.port2])}
async function chk(){if(!reg){upMsg="Mises à jour indisponibles ici.";return render()}
 upMsg='Recherche en cours…';render();
 try{await reg.update()}catch(e){upMsg='Impossible de vérifier : pas de réseau ?';return render()}
 const w=reg.installing||reg.waiting;
 if(w&&w.state!='activated'){upMsg='Téléchargement de la nouvelle version…';render();await new Promise(ok=>{const t=setTimeout(ok,8000);w.addEventListener('statechange',()=>{if(w.state=='activated'){clearTimeout(t);ok()}})})}
 upMsg=$('#upd')?'Nouvelle version prête : appuyez sur « Mettre à jour ».':'Vous avez déjà la dernière version.';render()}
async function start(){await load();fbInit();render();
 if('serviceWorker'in navigator){const had=navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{reg=r;askV();r.update().catch(()=>{});setInterval(()=>r.update().catch(()=>{}),18e5)}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{had?showUp():askV()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&reg)reg.update().catch(()=>{})})}}
start();
